[package]
name = "bevy_hair"
version = "0.1.0"
edition = "2024"
description = "Deferred software rasterization for real-time strand hair (Lipp et al. 2026)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { git = "https://github.com/mate-h/bevy", branch = "m/shadow-factors", features = ["3d"] }
bytemuck = { version = "1", features = ["derive"] }

[[example]]
name = "bake"
path = "examples/bake.rs"

[[example]]
name = "groom"
path = "examples/groom.rs"

[dev-dependencies]
bevy_camera_controller = { git = "https://github.com/mate-h/bevy", branch = "m/shadow-factors", features = ["free_camera"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
